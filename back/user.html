<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模块1 - 用户中心</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; margin-bottom: 10px; color: #333; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        .form-group input:focus { outline: none; border-color: #667eea; }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: translateY(-2px); }
        .tips {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 12px;
            color: #666;
        }
        .tips p { margin: 5px 0; }
        .error { color: #f56c6c; margin-top: 10px; text-align: center; }
        .success { color: #67c23a; margin-top: 10px; text-align: center; }
        .user-info {
            background: #e8f4fd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }
        .user-info p { margin: 5px 0; }
        .logout-btn {
            background: #f56c6c;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 物资借用系统</h1>
        <div class="subtitle">模块1：用户中心</div>
        
        <div id="loginForm">
            <div class="form-group">
                <label>学号</label>
                <input type="text" id="studentId" placeholder="请输入学号">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="请输入密码">
            </div>
            <button onclick="login()">登 录</button>
            <div id="msg" class="error"></div>
        </div>
        
        <div id="userInfo" class="user-info">
            <p><strong>当前用户</strong></p >
            <p>姓名：<span id="userName"></span></p >
            <p>学号：<span id="userStudentId"></span></p >
            <p>角色：<span id="userRole"></span></p >
            <button class="logout-btn" onclick="logout()">退出登录</button>
        </div>
        
        <div class="tips">
            <strong>📢 测试账号：</strong>
            <p>管理员：admin / 123456</p >
            <p>学生：2024001 / 123456</p >
            <p>负责人：2024002 / 123456</p >
            <hr style="margin: 10px 0;">
            <p>💡 提示：登录后请打开其他模块使用完整功能</p >
            <p>📌 物资模块：material.html</p >
            <p>📝 借用模块：borrow.html</p >
            <p>📊 统计模块：statistic.html</p >
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';
        
        async function login() {
            const student_id = document.getElementById('studentId').value;
            const password = document.getElementById('password').value;
            const msgDiv = document.getElementById('msg');
            
            if (!student_id || !password) {
                msgDiv.textContent = '请输入学号和密码';
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ student_id, password })
                });
                const result = await response.json();
                
                if (result.code === 200) {
                    localStorage.setItem('user', JSON.stringify(result.data));
                    displayUserInfo(result.data);
                    msgDiv.textContent = '';
                    msgDiv.className = 'success';
                    msgDiv.textContent = '✅ 登录成功！';
                } else {
                    msgDiv.textContent = result.message;
                }
            } catch (error) {
                msgDiv.textContent = '服务器连接失败，请确保后端已启动';
            }
        }
        
        function displayUserInfo(user) {
            const roleNames = {0: '学生', 1: '社团负责人', 2: '管理员'};
            document.getElementById('userName').textContent = user.name;
            document.getElementById('userStudentId').textContent = user.student_id;
            document.getElementById('userRole').textContent = roleNames[user.role] || '未知';
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('userInfo').style.display = 'block';
        }
        
        function logout() {
            localStorage.removeItem('user');
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('userInfo').style.display = 'none';
            document.getElementById('studentId').value = '';
            document.getElementById('password').value = '';
            document.getElementById('msg').textContent = '';
        }
        
        // 检查是否已登录
        const savedUser = localStorage.getItem('user');
        if (savedUser) {
            try {
                const user = JSON.parse(savedUser);
                displayUserInfo(user);
            } catch(e) {}
        }
    </script>
</body>
</html>
